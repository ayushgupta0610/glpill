name: GLPill
options:
  bundleIdPrefix: com.ayushgupta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  GLPill:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushgupta.glpill
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GLPill
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  GLPillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: GLPill
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GLPill:
    build:
      targets:
        GLPill: all
        GLPillTests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Resources/GLPill.storekit
    test:
      config: Debug
      targets:
        - GLPillTests
