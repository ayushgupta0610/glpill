name: GLPill
options:
  bundleIdPrefix: com.ayushgupta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: LPR84B522G
targets:
  GLPill:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Shared
      - App/Resources
    dependencies:
      - target: GLPillWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushgupta.glpill
        CODE_SIGN_ENTITLEMENTS: App/Resources/GLPill.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GLPill
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Resources/GLPill-Info.plist
        TARGETED_DEVICE_FAMILY: "1"
  GLPillWidget:
    type: app-extension
    platform: iOS
    sources:
      - App/Widget
      - App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushgupta.glpill.widget
        CODE_SIGN_ENTITLEMENTS: App/Widget/GLPillWidget.entitlements
        INFOPLIST_FILE: App/Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: GLPill
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  GLPillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
      - path: App/Resources/GLPill.storekit
        buildPhase: resources
    dependencies:
      - target: GLPill
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GLPillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: GLPill
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GLPill
schemes:
  GLPill:
    build:
      targets:
        GLPill: all
        GLPillWidget: all
        GLPillTests: [test]
        GLPillUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Resources/GLPill.storekit
    test:
      config: Debug
      storeKitConfiguration: App/Resources/GLPill.storekit
      commandLineArguments:
        "-disableCloudKit": true
      targets:
        - GLPillTests
        - GLPillUITests
